# A generic, single database configuration for Alembic.

[alembic]
# Path to migration scripts
script_location = alembic

# sys.path path, prepended to sys.path if present.
prepend_sys_path = .

# Version path separator used across operating systems
version_path_separator = os

# Default fallback connection URL (env.py dynamically overrides this via settings.SQLALCHEMY_DATABASE_URI)
sqlalchemy.url = postgresql://aipm_admin:aipm_secure_password123@127.0.0.1:5433/aipm_metadata

[post_write_hooks]
# Optional post-write hooks (e.g. running black or ruff on auto-generated migration scripts)
# hooks = ruff
# ruff.type = exec
# ruff.executable = %(here)s/.venv/bin/ruff
# ruff.options = --fix REVISION_SCRIPT_FILENAME

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S