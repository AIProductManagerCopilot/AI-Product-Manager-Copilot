version: '3.8'

services:
  # ==========================================
  # Database Layer (PostgreSQL)
  # ==========================================
  postgres_db:
    image: postgres:15-alpine
    container_name: aipm_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aipm_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aipm_secure_password123}
      POSTGRES_DB: ${POSTGRES_DB:-aipm_metadata}
    ports:
      # Map host port 5433 to container port 5432 to bypass local OS blockers cleanly
      - "5433:5432"
    volumes:
      - ./pgdata_fresh:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aipm_admin} -d ${POSTGRES_DB:-aipm_metadata}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - aipm_network

  # ==========================================
  # In-Memory Cache & Lock Store (Redis)
  # ==========================================
  redis_broker:
    image: redis:7-alpine
    container_name: aipm_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - aipm_network

  # ==========================================
  # Vector Search Engine (Qdrant)
  # ==========================================
  qdrant_vector:
    image: qdrant/qdrant:v1.9.2
    container_name: aipm_qdrant
    restart: always
    ports:
      - "6333:6333" # HTTP REST API & Web Dashboard
      - "6334:6334" # gRPC Interface
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__GRPC_PORT: 6334
      QDRANT__LOG_LEVEL: INFO
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - aipm_network

networks:
  aipm_network:
    driver: bridge

volumes:
  qdrant_data:
  redis_data: